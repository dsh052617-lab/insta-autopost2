name: 2. 인스타 게시

on:
  schedule:
    # 매일 경제 20:00 · AI 21:00 (한국시간) 게시. 각 25분 전에 시작해 정각까지 기다렸다 게시 (UTC 기준 cron)
    - cron: "35 10 * * *"
    - cron: "35 11 * * *"
    # 예비 실행: 위 예약이 늦거나 빠졌을 때 대비 (이미 게시된 초안은 건너뜀) → 20:12, 21:12
    - cron: "12 11 * * *"
    - cron: "12 12 * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "바로 게시할 이슈 번호 (비우면 오늘 예정분)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: insta
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: 패키지·한글 폰트 설치
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: 게시
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ISSUE: ${{ inputs.issue }}
        run: |
          if [ -n "$ISSUE" ]; then python src/publish.py --issue "$ISSUE"; else python src/publish.py; fi
