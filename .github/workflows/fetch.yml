name: 8. 출처 본문 미리 보기

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "가져올 주소들 (띄어쓰기로 구분)"
        required: false
        default: ""
      queries:
        description: "기사 주소 찾기 검색어 (| 로 구분, 선택)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          URLS: ${{ inputs.urls }}
          QUERIES: ${{ inputs.queries }}
        run: |
          rm -rf preview/fetched preview/found.txt
          if [ -n "$URLS" ]; then python src/fetch_text.py $URLS; fi
          if [ -n "$QUERIES" ]; then IFS='|' read -ra Q <<< "$QUERIES"; python src/find_news.py "${Q[@]}"; fi
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f preview
          git commit -m "출처 본문 미리 보기" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 3; done
