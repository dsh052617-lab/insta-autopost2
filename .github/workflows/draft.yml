name: 1. 초안 만들기

on:
  schedule:
    # 게시 전날 저녁 8시 23분(한국시간)에 초안 생성 → 월·수 11:23 UTC
    - cron: "23 11 * * 1,3"
    # 예비 실행: 위 예약이 GitHub 사정으로 빠졌을 때만 게시 당일 아침 9시 23분에 초안 생성(이미 있으면 건너뜀)
    - cron: "23 0 * * 2,4"
  workflow_dispatch:
    inputs:
      topic:
        description: "주제 (ai / economy, 비우면 일정대로)"
        required: false
        default: ""
      force:
        description: "같은 날짜 초안이 있어도 새로 만들기"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: insta
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: 패키지·한글 폰트 설치
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: 초안 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOPIC: ${{ inputs.topic }}
          FORCE: ${{ inputs.force }}
        run: |
          ARGS=""
          [ -n "$TOPIC" ] && ARGS="$ARGS --topic $TOPIC"
          [ "$FORCE" = "true" ] && ARGS="$ARGS --force"
          python src/draft.py $ARGS
