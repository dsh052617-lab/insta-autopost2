name: 1. 초안 만들기

on:
  schedule:
    # 예비 초안: 매일 낮 12시 53분(한국시간). 오전 Claude 예약 작업이 만든 초안이 없는 주제만 API로 만들어요.
    - cron: "53 3 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "주제 (ai / economy, 비우면 일정대로)"
        required: false
        default: ""
      force:
        description: "같은 날짜 초안이 있어도 새로 만들기"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: insta
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: 패키지·한글 폰트 설치
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: 초안 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOPIC: ${{ inputs.topic }}
          FORCE: ${{ inputs.force }}
        run: |
          ARGS=""
          [ "$FORCE" = "true" ] && ARGS="$ARGS --force"
          if [ -n "$TOPIC" ]; then
            python src/draft.py --topic "$TOPIC" $ARGS
          else
            # 오늘 게시할 주제마다 (이미 초안이 있으면 건너뜀). 하나가 실패해도 다른 주제는 계속
            rc=0
            for t in economy ai; do python src/draft.py --topic "$t" $ARGS || rc=1; done
            exit $rc
          fi
