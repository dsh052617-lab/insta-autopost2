# ─────────────────────────────────────────────
#  인스타 카드뉴스 자동 업로드 설정
#  이 파일만 고치면 대부분의 동작을 바꿀 수 있어요.
# ─────────────────────────────────────────────

account:
  handle: "@agi.economy.kr"
  project: "AGI시대 경제"           # 카드 상단·하단에 표시되는 프로젝트 이름
  audience: "AI가 바꾸는 경제에 관심 있는 일반 국민 (대학생·사회초년생 포함)"
  tone: "차분한 해설 기사 톤의 해요체. 과장·감탄사·느낌표·이모지 없이 사실 중심으로. 어려운 용어는 한 번 쉽게 풀어서 설명."

claude:
  model: "claude-opus-5-5"            # 글쓰기 모델. 비용을 줄이려면 claude-sonnet-5-5
  research_model: "claude-haiku-5-5"  # '내 주제'의 자료 검색 단계 (가장 저렴한 모델)

schedule:
  timezone: "Asia/Seoul"
  post_time: "20:00"               # 게시 시각 (바꾸면 .github/workflows/publish.yml의 cron도 같이 바꿔주세요)
  days:                            # 게시 요일: 주제  (요일을 바꾸면 draft.yml / publish.yml cron도 같이)
    tuesday: ai
    thursday: economy

instagram:
  ai_label: true                   # 인스타의 'AI 정보' 라벨 표시 (AI로 만든 콘텐츠임을 밝힘)

news:
  lookback_days: 7                 # 최근 7일 안에 나온 기사만 사용 (최신 이슈만)
  max_articles_per_post: 3         # 게시물 하나에 참고할 기사 수
  min_article_chars: 400           # 본문을 이만큼 못 가져온 기사는 사용하지 않음

# ─────────────────────────────────────────────
#  신뢰 출처 목록 (코드로 강제돼요)
#  - 여기 있는 도메인의 글만 사용. 그 외 사이트는 자동 제외
#  - official = 정부·중앙은행·국제기구·기업 공식 발표 / press = 주요 언론
#  - 한 게시물은 official 1건 이상, 또는 서로 다른 press 2곳 이상이 같은 내용을 다뤄야 함
#    (다른 언론사가 연합뉴스·뉴시스·뉴스1 기사를 그대로 실은 경우는 같은 1곳으로 셈)
#  - 출처가 부족하면 이 목록 안에서만 웹 검색해 같은 사건을 다룬 기사를 자동 보충
# ─────────────────────────────────────────────
